services:
  db:
    image: mariadb:11
    container_name: appwave
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_HOST: '%'
      MARIADB_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: appwave
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
